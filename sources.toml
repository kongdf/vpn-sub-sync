[probe]
enabled = true
timeout_secs = 3
concurrency = 50

[filter]
dedupe_endpoint = true
max_latency_ms = 3000
drop_unparsed = true

[naming]
enabled = true
first_name = "孔大夫"
template = "{source}-{country}-{latency}"
tag_source = true

[[source]]
name = "xrayvip"
kind = "direct"
url = "https://www.xrayvip.com/free.txt"
format = "v2ray"
enabled = true

[[source]]
name = "free-nodes"
kind = "github_readme"
repo = "free-nodes/v2rayfree"
branch = "main"
url_pattern = 'https://raw\.githubusercontent\.com/free-nodes/v2rayfree/main/v\d+'
format = "v2ray"
enabled = true

[[source]]
name = "nodev2rayn"
kind = "github_readme"
repo = "nodev2rayn/nodev2rayn.github.io"
branch = "main"
url_pattern = 'https://nodev2rayn\.github\.io/uploads/\d{4}/\d{2}/\d+-[\d]+\.txt'
format = "v2ray"
enabled = true
